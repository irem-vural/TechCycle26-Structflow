<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="StructFlow Aks icon">

  <defs>
    <linearGradient id="concrete" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F5F6"/>
      <stop offset="0.55" stop-color="#C7C8CC"/>
      <stop offset="1" stop-color="#67696F"/>
    </linearGradient>
    <linearGradient id="concreteSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7D8DB"/>
      <stop offset="1" stop-color="#535B68"/>
    </linearGradient>
    <linearGradient id="tealLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7294EC"/>
      <stop offset="1" stop-color="#3D6FE8"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.9" flood-color="#7294EC" flood-opacity="0.55"/>
    </filter>
    <style>
      .teal{stroke:#7294EC;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;}
      .thin{stroke:#D7D8DB;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;fill:none;}
      .dash{stroke:#A7ABB2;stroke-width:2;stroke-dasharray:4 5;stroke-linecap:round;fill:none;}
      .white{stroke:#D7D8DB;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}
      .concreteStroke{stroke:#D7D8DB;stroke-width:1.7;stroke-linejoin:round;}
      .rebar{stroke:#D7D8DB;stroke-width:2.2;stroke-linecap:round;}
      .speck{fill:#636872;opacity:.7;}
    </style>
  </defs>

  <path class="dash" d="M16 10 V54 M32 10 V54 M48 10 V54 M10 16 H54 M10 32 H54 M10 48 H54"/>
  <g filter="url(#softGlow)">
    <circle cx="16" cy="16" r="3.4" fill="none" stroke="#7294EC" stroke-width="2.7"/>
    <circle cx="48" cy="16" r="3.4" fill="none" stroke="#7294EC" stroke-width="2.7"/>
    <circle cx="16" cy="48" r="3.4" fill="none" stroke="#7294EC" stroke-width="2.7"/>
    <circle cx="48" cy="48" r="3.4" fill="none" stroke="#7294EC" stroke-width="2.7"/>
  </g>

</svg>
